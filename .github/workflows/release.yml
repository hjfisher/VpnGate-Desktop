name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-amd64:
    name: Build Windows (amd64)
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
      GOARCH: amd64
      CC: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Verify MinGW
        run: x86_64-w64-mingw32-gcc --version
      - name: Install MinGW packages for Fyne
        run: |
          choco install mingw -y --no-progress 2>$null || echo "Chocolatey not available"
          # Ensure we have the required libraries
      - run: go mod download
      - name: Test simple build
        run: |
          echo "Testing simple Go build..."
          echo 'package main; import "fmt"; func main() { fmt.Println("hello") }' > test.go
          go build -o test.exe test.go
          ./test.exe
          echo "Simple build OK"
      - name: Build
        run: |
          echo "Building Windows amd64 with CGO_ENABLED=$CGO_ENABLED CC=$CC"
          echo "Go version: $(go version)"
          echo "CC version: $("$CC" --version | head -1)"
          CGO_LDFLAGS="-lopengl32 -lgdi32" go build -v -trimpath -ldflags="-s -w" -o vpngate-desktop.exe . 2>&1 || (echo "=== BUILD FAILED ===" && exit 1)
      - name: Package
        shell: powershell
        run: Compress-Archive -Path vpngate-desktop.exe -DestinationPath vpngate-desktop-windows-amd64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: vpngate-desktop-windows-amd64
          path: vpngate-desktop-windows-amd64.zip
          retention-days: 7

  build-windows-386:
    name: Build Windows (386)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
      GOARCH: 386
      GOOS: windows
      CC: i686-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
      - run: i686-w64-mingw32-gcc --version
      - run: go mod download
      - name: Build
        run: |
          echo "Building Windows 386 with CGO_ENABLED=$CGO_ENABLED CC=$CC GOOS=$GOOS GOARCH=$GOARCH"
          CGO_LDFLAGS="-lopengl32 -lgdi32" go build -v -trimpath -ldflags="-s -w" -o vpngate-desktop.exe . 2>&1
      - name: Package
        run: zip vpngate-desktop-windows-386.zip vpngate-desktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: vpngate-desktop-windows-386
          path: vpngate-desktop-windows-386.zip
          retention-days: 7

  build-macos-amd64:
    name: Build macOS (amd64)
    runs-on: macos-latest
    env:
      CGO_ENABLED: 1
      GOARCH: amd64
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go mod download
      - name: Build
        run: |
          echo "Building macOS amd64 with CGO_ENABLED=$CGO_ENABLED CC=$CC"
          CGO_LDFLAGS="-framework OpenGL -framework Cocoa -framework IOKit" go build -v -trimpath -ldflags="-s -w" -o vpngate-desktop . 2>&1
      - run: tar -czf vpngate-desktop-darwin-amd64.tar.gz vpngate-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: vpngate-desktop-darwin-amd64
          path: vpngate-desktop-darwin-amd64.tar.gz
          retention-days: 7

  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-latest
    env:
      CGO_ENABLED: 1
      GOARCH: arm64
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go mod download
      - name: Build
        run: |
          echo "Building macOS arm64 with CGO_ENABLED=$CGO_ENABLED CC=$CC"
          CGO_LDFLAGS="-framework OpenGL -framework Cocoa -framework IOKit" go build -v -trimpath -ldflags="-s -w" -o vpngate-desktop . 2>&1
      - run: tar -czf vpngate-desktop-darwin-arm64.tar.gz vpngate-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: vpngate-desktop-darwin-arm64
          path: vpngate-desktop-darwin-arm64.tar.gz
          retention-days: 7

  build-linux-amd64:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
      GOARCH: amd64
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libgl1-mesa-dev libglfw3-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev \
            pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev
      - run: go mod download
      - name: Build
        run: |
          echo "Building Linux amd64 with CGO_ENABLED=$CGO_ENABLED CC=$CC"
          CGO_LDFLAGS="-lGL -lX11 -lXrandr -lXinerama -lXcursor -lXi -lXxf86vm -lwayland-client -lxkbcommon" go build -v -trimpath -ldflags="-s -w" -o vpngate-desktop . 2>&1
      - run: tar -czf vpngate-desktop-linux-amd64.tar.gz vpngate-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: vpngate-desktop-linux-amd64
          path: vpngate-desktop-linux-amd64.tar.gz
          retention-days: 7

  release:
    name: Create Release
    needs:
      - build-windows-amd64
      - build-windows-386
      - build-macos-amd64
      - build-macos-arm64
      - build-linux-amd64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpngate-desktop-*
          merge-multiple: false

      - name: List artifacts
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) | sort

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/*/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/*/*.tar.gz release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}