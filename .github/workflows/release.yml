name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows amd64 (native)
          - os: windows-latest
            arch: amd64
            artifact_name: vpngate-desktop-windows-amd64
            binary_name: vpngate-desktop.exe
            cc: x86_64-w64-mingw32-gcc
            cgo: 1
            ext: zip
            packager: powershell

          # Windows 386 (x86) - cross-compile
          - os: windows-latest
            arch: 386
            artifact_name: vpngate-desktop-windows-386
            binary_name: vpngate-desktop.exe
            cc: i686-w64-mingw32-gcc
            cgo: 1
            ext: zip
            packager: powershell

          # Windows arm64 - cross-compile
          - os: windows-latest
            arch: arm64
            artifact_name: vpngate-desktop-windows-arm64
            binary_name: vpngate-desktop.exe
            cc: aarch64-w64-mingw32-gcc
            cgo: 1
            ext: zip
            packager: powershell

          # macOS Intel (native)
          - os: macos-latest
            arch: amd64
            artifact_name: vpngate-desktop-darwin-amd64
            binary_name: vpngate-desktop
            cc: clang
            cgo: 1
            ext: tar.gz
            packager: tar

          # macOS Apple Silicon (native)
          - os: macos-latest
            arch: arm64
            artifact_name: vpngate-desktop-darwin-arm64
            binary_name: vpngate-desktop
            cc: clang
            cgo: 1
            ext: tar.gz
            packager: tar

          # Linux amd64 (native)
          - os: ubuntu-latest
            arch: amd64
            artifact_name: vpngate-desktop-linux-amd64
            binary_name: vpngate-desktop
            cc: gcc
            cgo: 1
            ext: tar.gz
            packager: tar

    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOARCH: ${{ matrix.arch }}
      CC: ${{ matrix.cc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # Linux amd64 - install complete CGO dependencies
      - name: Install CGO dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            libglfw3-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxxf86vm-dev \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev

      # Windows - verify MinGW cross-compilers are available
      - name: Verify MinGW (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Checking MinGW for ${{ matrix.arch }}..."
          ${{ matrix.cc }} --version 2>&1 || (echo "Compiler not found" && exit 1)

      # Windows 386/arm64 - try to install missing cross-compilers via chocolatey
      - name: Install Windows cross-compilers if missing
        if: runner.os == 'Windows' && (matrix.arch == '386' || matrix.arch == 'arm64')
        shell: powershell
        run: |
          $compiler = "${{ matrix.cc }}.exe"
          if (-not (Get-Command $compiler -ErrorAction SilentlyContinue)) {
            Write-Host "Installing MinGW cross-compilers via chocolatey..."
            choco install mingw -y --no-progress 2>$null || Write-Host "Chocolatey install failed, trying scoop..."
            scoop install mingw 2>$null || Write-Host "Scoop install failed"
          }
          if (Get-Command $compiler -ErrorAction SilentlyContinue) {
            $compiler --version
          } else {
            Write-Host "Warning: Compiler ${{ matrix.cc }} not available, build may fail"
          }

      - name: Download Go modules
        run: go mod download

      - name: Build
        run: |
          go build -v -trimpath -ldflags="-s -w" -o "${{ matrix.binary_name }}" .

      - name: Package artifact (Windows - PowerShell)
        if: matrix.packager == 'powershell'
        shell: powershell
        run: |
          Compress-Archive -Path "${{ matrix.binary_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Package artifact (Unix - tar)
        if: matrix.packager == 'tar'
        run: |
          tar -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.binary_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.ext }}
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpngate-desktop-*
          merge-multiple: false

      - name: List artifacts
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) | sort

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/*/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/*/*.tar.gz release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}