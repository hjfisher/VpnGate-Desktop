name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build with fyne-cross
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows/amd64
            artifact_name: vpngate-desktop-windows-amd64
            output: vpngate-desktop.exe
            ext: zip
          - target: windows/386
            artifact_name: vpngate-desktop-windows-386
            output: vpngate-desktop.exe
            ext: zip
          - target: darwin/amd64
            artifact_name: vpngate-desktop-darwin-amd64
            output: vpngate-desktop
            ext: tar.gz
          - target: darwin/arm64
            artifact_name: vpngate-desktop-darwin-arm64
            output: vpngate-desktop
            ext: tar.gz
          - target: linux/amd64
            artifact_name: vpngate-desktop-linux-amd64
            output: vpngate-desktop
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Build with fyne-cross
        uses: fyne-io/fyne-cross@v2
        with:
          target: ${{ matrix.target }}
          version: v2.6.0
          icon: ./assets/icon.png
          release: true

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cd fyne-cross/dist/${{ matrix.target }}
            zip -r ../../../artifacts/${{ matrix.artifact_name }}.zip ${{ matrix.output }}
            cd ../../..
          else
            cd fyne-cross/dist/${{ matrix.target }}
            tar -czf ../../../artifacts/${{ matrix.artifact_name }}.tar.gz ${{ matrix.output }}
            cd ../../..
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}.${{ matrix.ext }}
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vpngate-desktop-*
          merge-multiple: false

      - name: List artifacts
        run: |
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) | sort

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/*/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/*/*.tar.gz release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}